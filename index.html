<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArgTV PRO - Premium</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
  --bg: #0b0b0b; --panel: #141414; --green: #00c896; --red: #e50914; 
  --text: #fff; --muted: #aaaaaa; --line: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
button { cursor: pointer; font: inherit; }
.hidden { display: none !important; }

/* Header Glassmorphism */
.header { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); z-index: 50; display: flex; align-items: center; justify-content: space-between; transition: 0.3s; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
.brand span { color: var(--green); }

/* Hero Section (Banner Principal) */
.hero { position: relative; height: 60vh; width: 100%; background: url('https://image.tmdb.org/t/p/original/5vALXgH4J1kQj1kQj1kQj1kQj1k.jpg') center/cover; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, transparent 60%), linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 80%); }
.hero-content { position: absolute; bottom: 20px; left: 20px; right: 20px; z-index: 10; }
.hero-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
.hero-desc { font-size: 14px; color: #ddd; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.btn-play-hero { background: white; color: black; border: none; padding: 12px 24px; border-radius: 5px; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }

/* Carruseles (Filas) */
.row-container { margin-top: 20px; padding: 0 20px; }
.row-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #e5e5e5; }
.row-scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; padding-bottom: 15px; }
.row-scroll::-webkit-scrollbar { display: none; }

/* Tarjeta Estilo Poster */
.card { flex: 0 0 140px; scroll-snap-align: start; position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3; background: var(--panel); transition: transform 0.2s; }
.card:active { transform: scale(0.95); }
.card-img { width: 100%; height: 100%; object-fit: cover; }
.card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%); display: flex; align-items: flex-end; padding: 10px; }
.card-title { font-size: 12px; font-weight: bold; line-height: 1.2; }

/* Player Fullscreen Page */
.playerPage { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; }
.player-header { padding: 15px; display: flex; align-items: center; gap: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
.back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
.video-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
video { width: 100%; height: 100%; object-fit: contain; }

/* Panel Admin */
.admin { padding: 80px 20px 20px; }
.adminCard { background: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--line); }
.form input, .form select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; outline: none; }
.btn-green { background: var(--green); color: white; border: none; padding: 14px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; }
.btn-red { background: #b81d24; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 12px; }

/* Bottom Nav */
.bottomNav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
.nav { background: none; border: none; color: #777; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; transition: 0.2s; }
.nav.active { color: white; }
.nav.active span { color: var(--green); }
.nav span { font-size: 22px; }
</style>
</head>
<body>

<div id="app"></div>

<nav class="bottomNav">
  <button class="nav active" id="nav-home" onclick="goTo('home')"><span>🏠</span>Inicio</button>
  <button class="nav" id="nav-favs" onclick="goTo('favorites')"><span>⭐</span>Favoritos</button>
  <button class="nav" id="nav-admin" onclick="goTo('admin')"><span>⚙️</span>Panel</button>
</nav>

<script>
// --- DATOS CON IMÁGENES DE PÓSTERS ---
const STORAGE_KEY = "arg_tv_netflix_v4";
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  channels: [
    // Películas (Imágenes de TMDB para que se vea real)
    { id: "p1", name: "El Senior de los Anillos", category: "peliculas", image: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg", stream: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", desc: "Aventura épica" },
    { id: "p2", name: "Interestelar", category: "peliculas", image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", stream: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8", desc: "Ciencia ficción" },
    
    // Series
    { id: "s1", name: "Stranger Things", category: "series", image: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg", stream: "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8", desc: "Misterio y terror" },
    { id: "s2", name: "The Mandalorian", category: "series", image: "https://image.tmdb.org/t/p/w500/eU1i6eHXlzMOlEq0ku1Rzq7Y4wA.jpg", stream: "https://test-streams.mux.dev/pts_shift/master.m3u8", desc: "Star Wars" },
    
    // Canales en Vivo (Legales)
    { id: "c1", name: "NASA TV (En Vivo)", category: "canales", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/512px-NASA_logo.svg.png", stream: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8", desc: "Espacio en vivo" },
    { id: "c2", name: "Red Bull TV", category: "canales", image: "https://upload.wikimedia.org/wikipedia/en/thumb/f/fa/Red_Bull_TV_logo.svg/512px-Red_Bull_TV_logo.svg.png", stream: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", desc: "Deportes extremos" },
    { id: "c3", name: "DW Español", category: "canales", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/DW_Logo_2012.svg/512px-DW_Logo_2012.svg.png", stream: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8", desc: "Noticias internacionales" },
    
    // Música
    { id: "m1", name: "Vevo Pop", category: "musica", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Vevo_logo.svg/512px-Vevo_logo.svg.png", stream: "https://test-streams.mux.dev/dai-discontinuity-deltatre/manifest.m3u8", desc: "Videos musicales" }
  ],
  favorites: []
};

let currentView = "home";
let currentChannelId = null;
let hlsInstance = null;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// --- NAVEGACIÓN ---
function goTo(view) {
  currentView = view;
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
  const btn = document.getElementById(`nav-${view === 'home' ? 'home' : view === 'favorites' ? 'favs' : 'admin'}`);
  if(btn) btn.classList.add('active');
  window.scrollTo(0,0);
  render();
}

// --- RENDERIZADO ---
function render() {
  const app = document.getElementById("app");
  if (currentView === "home") app.innerHTML = renderHome();
  if (currentView === "favorites") app.innerHTML = renderFavorites();
  if (currentView === "admin") app.innerHTML = renderAdmin();
  if (currentView === "player") app.innerHTML = renderPlayer();
  if (currentView === "home" || currentView === "favorites") {
    document.body.style.paddingBottom = "80px";
  } else { document.body.style.paddingBottom = "0"; }
}

// --- VISTA INICIO ---
function renderHome() {
  // Agarrar un elemento al azar para el Banner (Hero)
  const featured = data.channels.find(c => c.category === 'peliculas') || data.channels[0];

  let html = `
    <!-- Header -->
    <header class="header">
      <div class="brand">ARGENTINA <span>TV PRO</span></div>
    </header>

    <!-- Hero Banner -->
    <div class="hero" style="background-image: url('${featured?.image || ''}')">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-title">${featured?.name || 'Bienvenido'}</div>
        <div class="hero-desc">${featured?.desc || 'Disfruta del mejor contenido.'}</div>
        <button class="btn-play-hero" onclick="openPlayer('${featured?.id}')">▶ Reproducir</button>
      </div>
    </div>

    <!-- Filas (Carruseles) -->
    <div id="rows-container">
  `;

  const categories = [
    { id: 'canales', title: '🔴 En Vivo' },
    { id: 'peliculas', title: '🍿 Películas' },
    { id: 'series', title: '🎬 Series' },
    { id: 'musica', title: '🎵 Música' }
  ];

  categories.forEach(cat => {
    const items = data.channels.filter(c => c.category === cat.id);
    if (items.length > 0) {
      html += `
        <div class="row-container">
          <div class="row-title">${cat.title}</div>
          <div class="row-scroll">
            ${items.map(c => `
              <div class="card" onclick="openPlayer('${c.id}')">
                <img class="card-img" src="${c.image || 'https://via.placeholder.com/300x450/141414/00c896?text=' + c.name.substring(0,10)}" alt="${c.name}">
                <div class="card-overlay">
                  <div class="card-title">${c.name}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
  });

  html += `</div>`;
  return html;
}

// --- VISTA FAVORITOS ---
function renderFavorites() {
  let favs = data.channels.filter(c => data.favorites.includes(c.id));
  let html = `
    <header class="header"><div class="brand">MIS <span>FAVORITOS</span></div></header>
    <div style="padding-top: 70px;" class="row-container">
      <div class="row-scroll" style="flex-wrap: wrap; overflow-x: hidden; justify-content: center;">
  `;
  
  if (favs.length === 0) {
    html += `<p style="color:var(--muted); text-align:center; width:100%; margin-top:20px;">No tenés favoritos aún.</p>`;
  } else {
    favs.forEach(c => {
      html += `
        <div class="card" onclick="openPlayer('${c.id}')">
          <img class="card-img" src="${c.image || 'https://via.placeholder.com/300x450/141414/00c896?text=' + c.name}">
          <div class="card-overlay"><div class="card-title">${c.name}</div></div>
        </div>`;
    });
  }
  html += `</div></div>`;
  return html;
}

// --- REPRODUCTOR ---
function openPlayer(id) {
  currentChannelId = id;
  goTo('player');
}

function renderPlayer() {
  const c = data.channels.find(x => x.id === currentChannelId);
  if(!c) return '';
  const isFav = data.favorites.includes(c.id);
  
  setTimeout(() => {
    const video = document.getElementById("videoPlayer");
    if (c.stream && video) {
      if (c.stream.includes(".m3u8") && Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(c.stream);
        hlsInstance.attachMedia(video);
      } else {
        video.src = c.stream;
      }
      video.play().catch(() => {});
    }
  }, 100);

  return `
    <div class="playerPage">
      <div class="player-header">
        <button class="back-btn" onclick="goTo('home')">←</button>
        <h2 style="font-size:18px;">${c.name}</h2>
        <button style="margin-left:auto; background:none; border:none; color:gold; font-size:26px;" onclick="toggleFav('${c.id}')">${isFav ? '★' : '☆'}</button>
      </div>
      <div class="video-container">
        <video id="videoPlayer" controls playsinline autoplay></video>
      </div>
    </div>
  `;
}

function toggleFav(id) {
  if (data.favorites.includes(id)) data.favorites = data.favorites.filter(x => x !== id);
  else data.favorites.push(id);
  save();
  render();
}

// --- ADMINISTRACIÓN ---
function renderAdmin() {
  let html = `
    <header class="header"><div class="brand">PANEL DE <span>CONTROL</span></div></header>
    <div class="admin">
      <div class="adminCard">
        <h3>➕ Agregar Contenido</h3><br>
        <div class="form">
          <input id="addName" placeholder="Título (Ej: Mi Película)">
          <select id="addCategory">
            <option value="peliculas">🍿 Película</option>
            <option value="series">🎬 Serie</option>
            <option value="canales">📺 Canal en Vivo</option>
            <option value="musica">🎵 Música</option>
          </select>
          <input id="addImage" placeholder="URL de la Imagen (Póster)">
          <input id="addStream" placeholder="URL del video (.m3u8 o .mp4)">
          <input id="addDesc" placeholder="Descripción corta">
          <button class="btn-green" onclick="addChannel()">Guardar</button>
        </div>
      </div>
      <div class="adminCard">
        <h3>📋 Mi Contenido</h3><br>
        <div id="adminList"></div>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const list = document.getElementById("adminList");
    data.channels.forEach(c => {
      list.innerHTML += `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding:10px 0;">
          <div style="max-width:70%;">
            <strong style="font-size:14px;">${c.name}</strong><br>
            <small style="color:#888; font-size:10px; word-break:break-all;">${c.category.toUpperCase()}</small>
          </div>
          <button class="btn-red" onclick="deleteChannel('${c.id}')">Borrar</button>
        </div>
      `;
    });
  }, 50);
  return html;
}

function addChannel() {
  const name = document.getElementById("addName").value;
  const category = document.getElementById("addCategory").value;
  const image = document.getElementById("addImage").value;
  const stream = document.getElementById("addStream").value;
  const desc = document.getElementById("addDesc").value;

  if (!name) return alert("El título es obligatorio");

  data.channels.push({ id: Date.now().toString(), name, category, image, stream, desc });
  save();
  goTo('home');
}

function deleteChannel(id) {
  if (!confirm("¿Borrar este contenido?")) return;
  data.channels = data.channels.filter(c => c.id !== id);
  save(); render();
}

// --- INICIO ---
goTo('home');
</script>
</body>
</html>
