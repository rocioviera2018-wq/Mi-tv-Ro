<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Argentina TV PRO</title>
<!-- HLS.js para reproducir streams .m3u8 en celulares -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
  --bg: #070a10; --panel: #10151f; --panel2: #151c27; --green: #00c896;
  --red: #ef3340; --text: #fff; --muted: #8e9aaa; --line: rgba(255,255,255,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
button { cursor: pointer; font: inherit; }
.hidden { display: none !important; }

/* Header */
.header { padding: 20px 16px; background: linear-gradient(145deg,#071016,#0b1720); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 40px; height: 40px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.search { margin-top: 15px; }
.search input { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--panel); color: white; }

/* Grid Canales */
.section { padding: 15px; }
.channels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.channel { background: var(--panel); border-radius: 15px; padding: 10px; text-align: center; border: 1px solid var(--line); }
.channelLogo { height: 70px; background: var(--panel2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 25px; margin-bottom: 8px; overflow: hidden; }
.channelLogo img { width: 100%; height: 100%; object-fit: contain; }
.channelName { font-size: 13px; font-weight: bold; }

/* Player */
.playerPage { padding: 15px; }
.video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; position: relative; }
video { width: 100%; height: 100%; object-fit: contain; }
.player-info { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
.btn-fav { background: var(--panel2); border: none; color: gold; font-size: 24px; padding: 10px; border-radius: 10px; }

/* Panel Admin */
.admin { padding: 15px; }
.adminCard { background: var(--panel); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--line); }
.form input, .form select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #0b1018; color: white; }
.btn-green { background: var(--green); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; }
.btn-red { background: var(--red); color: white; border: none; padding: 8px; border-radius: 8px; font-size: 12px; }

/* Bottom Nav */
.bottomNav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(9,13,20,.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--line); }
.nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
.nav.active { color: var(--green); }
.nav span { font-size: 20px; }
</style>
</head>
<body>

<div id="app"></div>

<nav class="bottomNav">
  <button class="nav" id="nav-home" onclick="goTo('home')"><span>🏠</span>Inicio</button>
  <button class="nav" id="nav-favs" onclick="goTo('favorites')"><span>⭐</span>Favoritos</button>
  <button class="nav" id="nav-admin" onclick="goTo('admin')"><span>⚙️</span>Panel</button>
</nav>

<script>
// --- DATOS ---
const STORAGE_KEY = "arg_tv_v2";
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  channels: [
    { id: "1", name: "Ejemplo TV", category: "aire", logo: "📺", stream: "", description: "Canal de prueba" }
  ],
  favorites: []
};
let currentView = "home";

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// --- NAVEGACIÓN ---
function goTo(view) {
  currentView = view;
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
  if(view === 'home') document.getElementById('nav-home').classList.add('active');
  if(view === 'favorites') document.getElementById('nav-favs').classList.add('active');
  if(view === 'admin') document.getElementById('nav-admin').classList.add('active');
  
  render();
}

// --- RENDERIZADO PRINCIPAL ---
function render() {
  const app = document.getElementById("app");
  if (currentView === "home") app.innerHTML = renderHome();
  if (currentView === "favorites") app.innerHTML = renderFavorites();
  if (currentView === "admin") app.innerHTML = renderAdmin();
  if (currentView === "player") app.innerHTML = renderPlayer();
}

// --- VISTA INICIO ---
function renderHome() {
  let html = `
    <header class="header">
      <div class="brand"><div class="logo">📺</div><h1>Argentina TV PRO</h1></div>
    </header>
    <section class="section">
      <h2>Canales Disponibles</h2>
      <div class="channels">`;
  
  data.channels.forEach(c => {
    html += `
      <div class="channel" onclick="openPlayer('${c.id}')">
        <div class="channelLogo">${c.logo || '📺'}</div>
        <div class="channelName">${c.name}</div>
      </div>`;
  });
  
  html += `</div></section>`;
  return html;
}

// --- VISTA FAVORITOS ---
function renderFavorites() {
  let favs = data.channels.filter(c => data.favorites.includes(c.id));
  let html = `<div class="section"><h2>⭐ Mis Favoritos</h2><br>`;
  
  if (favs.length === 0) {
    html += `<p style="color:var(--muted)">No tenés favoritos guardados.</p>`;
  } else {
    html += `<div class="channels">`;
    favs.forEach(c => {
      html += `
        <div class="channel" onclick="openPlayer('${c.id}')">
          <div class="channelLogo">${c.logo || '📺'}</div>
          <div class="channelName">${c.name}</div>
        </div>`;
    });
    html += `</div>`;
  }
  
  html += `</div>`;
  return html;
}

// --- REPRODUCTOR ---
let currentChannelId = null;
let hlsInstance = null;

function openPlayer(id) {
  currentChannelId = id;
  currentView = "player";
  render();
}

function renderPlayer() {
  const c = data.channels.find(x => x.id === currentChannelId);
  const isFav = data.favorites.includes(c.id);
  
  // Iniciar el video después de que se dibuje el HTML
  setTimeout(() => {
    const video = document.getElementById("videoPlayer");
    if (c.stream && video) {
      if (c.stream.includes(".m3u8") && Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(c.stream);
        hlsInstance.attachMedia(video);
      } else {
        video.src = c.stream;
      }
      video.play().catch(() => {});
    }
  }, 100);

  return `
    <div class="playerPage">
      <button onclick="goTo('home')" style="background:none;border:none;color:var(--muted);margin-bottom:10px">← Volver</button>
      <div class="video-container">
        <video id="videoPlayer" controls playsinline></video>
      </div>
      <div class="player-info">
        <div>
          <h2>${c.name}</h2>
          <p style="color:var(--muted);font-size:12px">${c.description || ''}</p>
        </div>
        <button class="btn-fav" onclick="toggleFav('${c.id}')">${isFav ? '★' : '☆'}</button>
      </div>
    </div>
  `;
}

function toggleFav(id) {
  if (data.favorites.includes(id)) {
    data.favorites = data.favorites.filter(x => x !== id);
  } else {
    data.favorites.push(id);
  }
  save();
  render();
}

// --- ADMINISTRACIÓN ---
function renderAdmin() {
  let html = `
    <div class="admin">
      <h2>⚙️ Panel de Control</h2><br>
      <div class="adminCard">
        <h3>➕ Agregar Canal</h3><br>
        <div class="form">
          <input id="addName" placeholder="Nombre del canal (Ej: TV Pública)">
          <input id="addLogo" placeholder="Emoji (Ej: 📺) o URL de imagen">
          <input id="addStream" placeholder="URL del stream (.m3u8 o .mp4)">
          <input id="addDesc" placeholder="Descripción corta">
          <button class="btn-green" onclick="addChannel()">Guardar Canal</button>
        </div>
      </div>
      <div class="adminCard">
        <h3>📋 Mis Canales</h3><br>
        <div id="adminList"></div>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const list = document.getElementById("adminList");
    if (data.channels.length === 0) list.innerHTML = "<p>No hay canales.</p>";
    
    data.channels.forEach(c => {
      list.innerHTML += `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:10px 0;">
          <div>
            <strong>${c.name}</strong><br>
            <small style="color:var(--muted);word-break:break-all;">${c.stream || 'Sin URL'}</small>
          </div>
          <button class="btn-red" onclick="deleteChannel('${c.id}')">Borrar</button>
        </div>
      `;
    });
  }, 50);

  return html;
}

function addChannel() {
  const name = document.getElementById("addName").value;
  const logo = document.getElementById("addLogo").value;
  const stream = document.getElementById("addStream").value;
  const desc = document.getElementById("addDesc").value;

  if (!name) return alert("El nombre es obligatorio");

  data.channels.push({
    id: Date.now().toString(),
    name: name,
    logo: logo || "📺",
    stream: stream,
    description: desc
  });

  save();
  render();
  alert("Canal agregado con éxito");
}

function deleteChannel(id) {
  if (!confirm("¿Borrar este canal?")) return;
  data.channels = data.channels.filter(c => c.id !== id);
  data.favorites = data.favorites.filter(f => f !== id);
  save();
  render();
}

// --- INICIO ---
goTo('home');
</script>
</body>
</html>
